# Checks content and builds the VitePress site on every pull request and push; from `main` it
# deploys to Netlify (pp.mohirlab.uz) and points the old GitHub Pages URL at the new domain.
#
# Repository secrets: NETLIFY_AUTH_TOKEN (personal access token), NETLIFY_SITE_ID
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; superseded PR runs are cancelled, production runs are not
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for "last updated" timestamps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Toolchains for the code-sample syntax check (Python and Rust/rustfmt ship with the runner)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # samples use pattern matching for switch

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Check Mermaid diagrams
        run: bun run check:mermaid

      - name: Check code samples
        run: node scripts/check-code-samples.mjs --strict

      - name: Build with VitePress
        run: bun run build
        env:
          SITE_BASE: /

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: .vitepress/dist
          retention-days: 7

      # Served for the root and, as 404.html, for every old deep link
      - name: Upload GitHub Pages redirect
        if: github.event_name != 'pull_request'
        run: cp .github/pages-redirect/index.html .github/pages-redirect/404.html

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect

  deploy-netlify:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pp.mohirlab.uz
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # The commit message goes through env, never straight into the script, so it can't inject shell
      - name: Deploy to Netlify
        run: |
          npx --yes netlify-cli@27 deploy --prod --no-build --dir dist --message "${GITHUB_SHA::7}: ${COMMIT_MESSAGE%%$'\n'*}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual deploy' }}

  # Old URL (otabekoff.github.io/principles/) forwards every path to pp.mohirlab.uz
  deploy-pages-redirect:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
